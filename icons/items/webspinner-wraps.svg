<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Webspinner Wraps</title>
  <defs>
    <linearGradient id="violetSilk" x1="16" y1="7" x2="49" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b7db3"/>
      <stop offset=".43" stop-color="#50405f"/>
      <stop offset="1" stop-color="#292235"/>
    </linearGradient>
    <linearGradient id="arcaneThread" x1="21" y1="19" x2="45" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffaff"/>
      <stop offset=".45" stop-color="#d3c6e5"/>
      <stop offset="1" stop-color="#806d9b"/>
    </linearGradient>
    <radialGradient id="spark" cx="40%" cy="35%" r="70%">
      <stop stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#d9c8ff"/>
      <stop offset=".65" stop-color="#9b6ed1"/>
      <stop offset="1" stop-color="#4b286e"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- A single open silk glove keeps the hand silhouette unmistakable. -->
  <path d="m20 31-3-14c-1-4 1-7 4-7s5 2 6 6l1 8-1-15c0-4 2-7 6-7 3 0 5 3 5 7v15l2-12c1-4 3-6 6-5 4 1 5 4 4 8l-3 13 4-8c2-4 5-5 8-2 2 2 1 6-1 10l-8 17c-3 7-8 11-16 11-8 0-14-4-17-11L9 35c-3-4-2-8 1-10 3-1 6 1 8 4l2 2Z" fill="url(#violetSilk)" stroke="#221a2b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M21 29c7-5 19-6 28 0l1 13c-3 8-9 12-16 12-8 0-14-5-17-12l4-13Z" fill="#44354f" stroke="#2a2033" stroke-width="1.2"/>

  <!-- Silver thread radiates from the palm like a spider web, the item's identifying motif. -->
  <circle cx="34" cy="38" r="3.1" fill="url(#spark)" stroke="#f1e9ff" stroke-width="1"/>
  <path d="M34 38 24 29m10 9-1-13m1 13 10-11M34 38l13 1M34 38l8 11m-8-11-5 13m5-13-13 5" fill="none" stroke="url(#arcaneThread)" stroke-width="1.35" stroke-linecap="round"/>
  <path d="M28 33c3-3 8-4 12-1m-15-2c5-5 13-7 20-3m-17 18c4 2 8 2 12 0m-16-4c6 3 14 3 20-1" fill="none" stroke="#d8cae9" stroke-width="1.2" stroke-linecap="round" opacity=".95"/>
  <path d="m28 25-1-10m11 10V9m9 19 3-13" fill="none" stroke="#bea9d1" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>

  <!-- The luminous flared cuff reads as enchanted cloth rather than leather armor. -->
  <path d="m18 48 26-2 5 14H17l1-12Z" fill="url(#violetSilk)" stroke="#221a2b" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="m20 49 24-2 2 6-28 3 2-7Z" fill="url(#arcaneThread)" stroke="#69577e" stroke-width="1.1"/>
  <path d="M22 56c7-2 15-2 23-1" fill="none" stroke="#e8deef" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2"/>
  <circle cx="34" cy="38" r="7" fill="#b882ff" opacity=".18" filter="url(#glow)"/>
</svg>
