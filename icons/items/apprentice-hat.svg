<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Apprentice Hat</title>
  <defs>
    <linearGradient id="crown" x1="29" y1="3" x2="37" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e06a46"/>
      <stop offset=".38" stop-color="#b23f31"/>
      <stop offset=".74" stop-color="#79282b"/>
      <stop offset="1" stop-color="#461e26"/>
    </linearGradient>
    <linearGradient id="brim" x1="8" y1="42" x2="53" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d65a3e"/>
      <stop offset=".46" stop-color="#99322e"/>
      <stop offset="1" stop-color="#491f28"/>
    </linearGradient>
    <linearGradient id="band" x1="17" y1="38" x2="47" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#502925"/>
      <stop offset=".52" stop-color="#281a20"/>
      <stop offset="1" stop-color="#5f3028"/>
    </linearGradient>
    <linearGradient id="gold" x1="29" y1="39" x2="39" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe784"/>
      <stop offset=".42" stop-color="#c98535"/>
      <stop offset="1" stop-color="#673627"/>
    </linearGradient>
  </defs>

  <!-- Broad oval brim beneath a clean, uninterrupted pointed crown. -->
  <path d="M4 47c9-7 22-10 36-7 10 2 18 6 21 12-9 7-23 9-39 6C10 56 3 52 4 47Z" fill="url(#brim)" stroke="#291920" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M7 47c13 4 30 6 51 5-5-5-12-8-20-10-11-2-22 0-31 5Z" fill="#c84b36" opacity=".88"/>
  <path d="M13 51c11 4 27 5 40 2" fill="none" stroke="#ef8653" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>

  <!-- The tip rises directly from the cone with no folded or floppy hook. -->
  <path d="M16 45c5-15 9-28 15-39 1-3 3-4 5-4 3 1 4 3 4 7 1 12 3 24 7 36-10 4-21 4-31 0Z" fill="url(#crown)" stroke="#301a22" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 6c-4 12-7 24-9 37" fill="none" stroke="#f18a58" stroke-width="1.7" stroke-linecap="round" opacity=".62"/>

  <path d="M17 37c9 4 19 5 28 1l2 8c-10 4-21 4-32 0l2-9Z" fill="url(#band)" stroke="#2b1920" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M29 39h10l1 9-11-1v-8Z" fill="url(#gold)" stroke="#583027" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="m32 42 5 .2v3.5l-5-.3V42Z" fill="#48231f"/>
</svg>
