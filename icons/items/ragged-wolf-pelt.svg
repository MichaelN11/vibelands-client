<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Ragged Wolf Pelt</title>
  <defs>
    <linearGradient id="fur" x1="17" y1="7" x2="48" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c5c8cb"/>
      <stop offset=".34" stop-color="#898d92"/>
      <stop offset=".72" stop-color="#50545a"/>
      <stop offset="1" stop-color="#292d32"/>
    </linearGradient>
    <linearGradient id="belly" x1="25" y1="28" x2="38" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#aaaead"/>
      <stop offset=".52" stop-color="#747873"/>
      <stop offset="1" stop-color="#41453f"/>
    </linearGradient>
  </defs>

  <!-- A splayed hide silhouette: broad forelegs, narrow waist, torn hind legs, and tail. -->
  <path d="M25 27c-5 1-10 3-14 7L4 43l8 5 8-8-2 12-6 6 10 3 6-9 4 6 4-6 7 9 10-3-7-8-1-11 7 7 8-6-8-8c-4-4-9-5-13-6H25Z" fill="url(#fur)" stroke="#252a2f" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M25 31c-2 8-1 15 3 21l4 6 4-6c4-7 5-14 3-21l-7-4-7 4Z" fill="url(#belly)" stroke="#484d4c" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M46 45c6 1 10 4 12 8-4-1-7 0-9 3" fill="none" stroke="#34383d" stroke-width="5" stroke-linecap="round"/>
  <path d="M47 45c5 2 8 4 10 7" fill="none" stroke="#a8abad" stroke-width="1.3" stroke-linecap="round" opacity=".72"/>

  <!-- The intact head is separate and readable above the laid-out body. -->
  <path d="m18 8 10 6 4-4 4 4 10-6-3 13 4 6-7 6-8 4-8-4-7-6 4-6-3-13Z" fill="url(#fur)" stroke="#252a2f" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="m20 10 8 7-8 3 3-9m21-1-8 7 8 3-3-9" fill="#4a4e54" stroke="#2c3035" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="m24 19 8-5 8 5-1 9-7 7-7-7-1-9Z" fill="#969a9c" stroke="#3b4044" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="m27 24 5-3 5 3-1 6-4 4-4-4-1-6Z" fill="#c2c3bd" opacity=".72"/>
  <path d="m29 25 3-2 3 2-1 3h-4l-1-3Z" fill="#24272a"/>
  <path d="m28 30 4 2 4-2" fill="none" stroke="#303337" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M26 21h1m10 0h1" fill="none" stroke="#e0bd5d" stroke-width="2" stroke-linecap="round"/>

  <!-- Missing fur and uneven tears show why this pelt is only vendor trash. -->
  <path d="m27 39 3-4 5 3-2 5 4 4-5 5-6-4 3-5-2-4Z" fill="#756556" stroke="#3e3b38" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M28 38c2 1 4 1 6 0m-7 10c3-1 6 0 8 2" fill="none" stroke="#b59c7b" stroke-width="1" stroke-linecap="round"/>
  <path d="m14 36 6 1-4 5m34-7-6 2 4 5M19 51l5-2-2 7m23-6-5-1 3 7" fill="none" stroke="#d0d2d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".76"/>
</svg>
