<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Darklurk Vest</title>
  <defs>
    <linearGradient id="cloth" x1="18" y1="10" x2="47" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7c746c"/>
      <stop offset=".45" stop-color="#504b48"/>
      <stop offset="1" stop-color="#29282c"/>
    </linearGradient>
    <linearGradient id="leather" x1="12" y1="14" x2="48" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#836449"/>
      <stop offset=".5" stop-color="#594536"/>
      <stop offset="1" stop-color="#2e2929"/>
    </linearGradient>
    <linearGradient id="trim" x1="24" y1="11" x2="41" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a29380"/>
      <stop offset="1" stop-color="#514942"/>
    </linearGradient>
  </defs>

  <!-- Broad cap shoulders and a pinched waist give this common vest a clear armor silhouette. -->
  <path d="m20 13-9 4-7 12 8 6 7-8-2 15 2 17 13-4 13 4 2-17-2-15 7 8 8-6-7-12-9-4H20Z" fill="url(#leather)" stroke="#211f22" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M21 12c3-2 7-3 11-3s8 1 11 3l4 17-3 29-12-3-12 3-3-29 4-17Z" fill="url(#cloth)" stroke="#211f22" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M22 13c2-5 6-7 10-7s8 2 10 7l-4 9-6-5-6 5-4-9Z" fill="#29282c" stroke="url(#trim)" stroke-width="2" stroke-linejoin="round"/>

  <!-- Simple leather reinforcement and fastening keep the reward grounded and practical. -->
  <path d="M20 25c8 3 16 3 24 0l2 8c-9 3-19 3-28 0l2-8ZM18 44c9 3 19 3 28 0l1 7c-10 3-20 3-30 0l1-7Z" fill="url(#leather)" stroke="#302724" stroke-width="1.4"/>
  <path d="M29 20h6v35h-6z" fill="#44362f" stroke="#272226" stroke-width="1.2"/>
  <path d="m27 24 10 5-10 5 10 5-10 5" fill="none" stroke="#a18b70" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="28" cy="24" r="1.2" fill="#b3a48e"/>
  <circle cx="36" cy="29" r="1.2" fill="#b3a48e"/>

  <!-- Pale, asymmetrical abrasion lines suggest old webbing scars rather than ornament. -->
  <g fill="none" stroke="#b8b1a7" stroke-linecap="round" opacity=".72">
    <path d="M39 19v15m0-9 7-5m-7 9 7 4" stroke-width="1.25"/>
    <path d="M41 23c2 1 3 2 4 4m-5 2c2 0 4 1 5 3" stroke-width="1"/>
    <path d="m11 22 7 4m35-4-7 4" stroke-width="1.2" opacity=".6"/>
  </g>
</svg>
