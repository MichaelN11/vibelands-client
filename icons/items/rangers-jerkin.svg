<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Ranger's Jerkin</title>
  <defs>
    <linearGradient id="leather" x1="18" y1="10" x2="47" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78865c"/>
      <stop offset=".42" stop-color="#526343"/>
      <stop offset="1" stop-color="#283626"/>
    </linearGradient>
    <linearGradient id="shoulder" x1="7" y1="15" x2="54" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66764e"/>
      <stop offset=".55" stop-color="#435438"/>
      <stop offset="1" stop-color="#243023"/>
    </linearGradient>
    <linearGradient id="trim" x1="23" y1="10" x2="42" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c3a15c"/>
      <stop offset=".5" stop-color="#9b7a43"/>
      <stop offset="1" stop-color="#60492d"/>
    </linearGradient>
  </defs>

  <!-- Broad shoulders, pinched waist, and split leather skirts give the jerkin its ranger silhouette. -->
  <path d="m20 13-10 4-6 12 8 7 7-8-2 14 2 17 13-4 13 4 2-17-2-14 7 8 8-7-6-12-10-4H20Z" fill="url(#shoulder)" stroke="#1d271e" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M21 12c3-2 7-3 11-3s8 1 11 3l4 17-3 29-12-4-12 4-3-29 4-17Z" fill="url(#leather)" stroke="#1d271e" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Rolled hide collar, crossed cord placket, and trail belt echo the equipped model. -->
  <path d="M21 13c2-6 7-8 11-8s9 2 11 8l-5 9-6-5-6 5-5-9Z" fill="#29372a" stroke="url(#trim)" stroke-width="2" stroke-linejoin="round"/>
  <path d="M26 21h12l3 22H23l3-22Z" fill="#46583a" stroke="#263326" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="m26 24 12 5-12 5 13 5-14 5m13-20-12 5 12 5-13 5 14 5" fill="none" stroke="#c6a564" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25" cy="24" r="1.4" fill="#dac17c" stroke="#3c3024" stroke-width=".7"/>
  <circle cx="39" cy="24" r="1.4" fill="#dac17c" stroke="#3c3024" stroke-width=".7"/>
  <path d="M18 43c9 3 19 3 28 0l1 7c-10 3-20 3-30 0l1-7Z" fill="url(#trim)" stroke="#352b22" stroke-width="1.5"/>
  <path d="M28 43h8v8h-8z" fill="#384431" stroke="#d5b568" stroke-width="1.4"/>

  <!-- Individual hem panels keep the lower edge from reading like a shirt. -->
  <path d="m20 51 6 1-1 6-6 1m12-7v4l-6 2m19 1-6-1-1-6 7-1m-11 1v4l5 2" fill="none" stroke="#b79656" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M11 22c3 2 5 4 7 7m35-7c-3 2-5 4-7 7" fill="none" stroke="#a98a51" stroke-width="1.3" stroke-linecap="round" opacity=".8"/>
</svg>
