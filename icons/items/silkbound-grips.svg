<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Silkbound Grips</title>
  <defs>
    <linearGradient id="leather" x1="18" y1="10" x2="47" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b6a55"/>
      <stop offset=".48" stop-color="#57463d"/>
      <stop offset="1" stop-color="#2b2224"/>
    </linearGradient>
    <linearGradient id="silk" x1="18" y1="20" x2="46" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eee5dc"/>
      <stop offset=".45" stop-color="#b9a99a"/>
      <stop offset="1" stop-color="#776b67"/>
    </linearGradient>
    <linearGradient id="cuff" x1="17" y1="45" x2="47" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6c5344"/>
      <stop offset="1" stop-color="#302428"/>
    </linearGradient>
  </defs>

  <!-- Four naturally stepped fingers and the thumb flow into one centered palm. -->
  <path d="m19 31-2-13c-1-4 1-7 4-7 3 0 5 2 5 6l1 8-1-15c0-4 2-6 6-6 3 0 5 3 5 7v13l1-15c0-4 2-6 5-5 3 0 5 3 4 7l-1 15 2-10c1-4 3-6 6-5 3 1 4 4 3 8l-4 18c-2 9-9 15-18 17-8 1-15-3-18-10l-8-9c-3-4-2-7 2-9 3-1 5 1 7 4l1 2Z" fill="url(#leather)" stroke="#231c21" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M19 27c8-4 22-5 33 1l1 11c-3 9-9 14-18 15-8 1-14-3-18-11l2-16Z" fill="#4b3933" stroke="#2b2023" stroke-width="1.3"/>

  <!-- Short shaded returns make each silk turn disappear around the palm instead of floating past it. -->
  <path d="m21 23 31 10-2 6-30-10 1-6Zm-3 9 32 10-3 6-30-10 1-6Zm-1 9 27 9-4 6-24-9 1-6Z" fill="url(#silk)" stroke="#625954" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="m21 23-3 2v4l2 1 1-7Zm-3 9-3 2v4l2 1 1-7Zm-1 9-3 2v4l2 1 1-7Z" fill="#81736d" stroke="#504743" stroke-width=".9" stroke-linejoin="round"/>
  <path d="m22 25 28 9M19 34l29 10M18 43l24 9" fill="none" stroke="#fff9ef" stroke-width="1.1" stroke-linecap="round" opacity=".75"/>
  <path d="m27 25-1-10m11 9V10m9 17 2-15m5 18 3-12" fill="none" stroke="#bcaa9c" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>

  <!-- A reinforced cuff anchors the wrapped hand and separates it from the silk glove icon. -->
  <path d="m17 48 29-2 5 14H16l1-12Z" fill="url(#cuff)" stroke="#231c21" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="m19 49 27-2 2 6-31 3 2-7Z" fill="url(#silk)" stroke="#5f5551" stroke-width="1.2"/>
  <path d="M28 52h12v7H28z" fill="#594239" stroke="#d8c9bb" stroke-width="1.3"/>
</svg>
