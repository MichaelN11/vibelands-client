<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Embersilk Hood</title>
  <defs>
    <linearGradient id="cloth" x1="17" y1="8" x2="47" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d45b43"/>
      <stop offset=".3" stop-color="#a43732"/>
      <stop offset=".68" stop-color="#6c242b"/>
      <stop offset="1" stop-color="#351b24"/>
    </linearGradient>
    <linearGradient id="clothLight" x1="18" y1="14" x2="34" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f08155"/>
      <stop offset=".55" stop-color="#b74338"/>
      <stop offset="1" stop-color="#6e252c"/>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="21" x2="45" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe28a"/>
      <stop offset=".38" stop-color="#d7a348"/>
      <stop offset=".72" stop-color="#9a5c2d"/>
      <stop offset="1" stop-color="#5e3327"/>
    </linearGradient>
    <radialGradient id="opening" cx="48%" cy="40%" r="65%">
      <stop stop-color="#37252d"/>
      <stop offset="1" stop-color="#151319"/>
    </radialGradient>
  </defs>

  <!-- A peaked open-faced hood with a broad shoulder mantle. -->
  <path d="M9 60c1-9 6-15 12-20h22c6 5 11 11 12 20-8-3-16-4-23-2-7-2-15-1-23 2Z" fill="url(#cloth)" stroke="#281820" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M13 56c5.5-4 12-6 19-5 7-1 13.5 1 19 5" fill="none" stroke="#ed714e" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
  <path d="M14 43C10 22 19 7 32 2c13 5 22 20 18 41l-8 9H22l-8-9Z" fill="url(#cloth)" stroke="#281820" stroke-width="2.7" stroke-linejoin="round"/>
  <path d="M18 40C15.5 23 22 11 32 6c1 15 0 29-4 43l-6 .5-4-9.5Z" fill="url(#clothLight)" opacity=".78"/>
  <path d="M32 4c3 8 3 14 0 18" fill="none" stroke="#f18a5d" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>

  <!-- Deep face opening and gold piping preserve the hood silhouette at 32 px. -->
  <path d="M20.5 26c2.2-7 6-11 11.5-13 5.5 2 9.3 6 11.5 13l-3.5 17c-5.5 4-10.5 4-16 0l-3.5-17Z" fill="url(#opening)" stroke="url(#gold)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M22.8 25c2.2-5 5.3-8 9.2-9.5 3.9 1.5 7 4.5 9.2 9.5" fill="none" stroke="#ffe098" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
  <path d="M19 46c7 3 19 3 26 0l3.5 5c-9 5-24 5-33 0l3.5-5Z" fill="url(#gold)" stroke="#5a3027" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M23.5 47c5 1.4 12 1.4 17 0" fill="none" stroke="#ffe19a" stroke-width="1" stroke-linecap="round" opacity=".75"/>

  <!-- Ember-thread stitches are cloth details, not a background effect. -->
  <path d="m14.5 49 3 2m32-2-3 2M14.5 35l3 1m32-1-3 1" fill="none" stroke="#f3b45c" stroke-width="1.4" stroke-linecap="round"/>
</svg>
