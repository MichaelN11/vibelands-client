<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Rockfist Battle Plans on Worn Parchment</title>
  <defs>
    <linearGradient id="parchment" x1="16" y1="11" x2="49" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4dda0"/>
      <stop offset=".42" stop-color="#c99a55"/>
      <stop offset=".78" stop-color="#9a6236"/>
      <stop offset="1" stop-color="#573523"/>
    </linearGradient>
    <linearGradient id="curl" x1="10" y1="15" x2="24" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0bd"/>
      <stop offset=".52" stop-color="#c18a4b"/>
      <stop offset="1" stop-color="#694027"/>
    </linearGradient>
    <linearGradient id="fold" x1="42" y1="43" x2="54" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#744426"/>
      <stop offset=".55" stop-color="#b77c40"/>
      <stop offset="1" stop-color="#edca80"/>
    </linearGradient>
  </defs>

  <!-- A battered open map, angled to keep the parchment silhouette distinct at inventory scale. -->
  <path d="m13 11 10 2 8-2 9 3 12-1-2 9 2 8-3 8 2 10-9-1-8 5-8-3-11 2 1-10-3-8 3-8-1-11Z" fill="#34241e" stroke="#241a18" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="m14 12 9 3 8-2 9 3 10-1-2 7 2 8-3 8 2 8-9-1-8 5-8-3-9 2 1-9-3-8 3-8-1-9Z" fill="url(#parchment)"/>

  <!-- Rolled and folded corners make the plans feel like a carried physical quest item. -->
  <path d="M14 12c4 1 8 2 11 1-4 3-6 7-6 12-3-3-5-7-5-13Z" fill="url(#curl)" stroke="#5a3827" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M14 12c3 3 5 7 5 13" fill="none" stroke="#ffe9ae" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <path d="m39 45 10 1-9 5-8-3 7-3Z" fill="url(#fold)" stroke="#5b3825" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Charcoal terrain strokes and an ochre assault mark communicate crude battle plans without text. -->
  <path d="M24 21c5 1 8 3 9 7 1 3 4 4 8 4m-18 9c3-5 7-7 11-7 5 0 8-4 11-9" fill="none" stroke="#4b3a2b" stroke-width="2.3" stroke-linecap="round" stroke-dasharray="2.5 3"/>
  <path d="m25 25 5-3 4 4m-8-2 4 5" fill="none" stroke="#4b3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m36 34 5-4-1 6 5-3" fill="none" stroke="#4b3a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m23 33 8 8m0-9-8 9" fill="none" stroke="#9b3027" stroke-width="3.4" stroke-linecap="round"/>
  <path d="m40 19 5 2-1 5-5-1-2-3 3-3Z" fill="#6b5134" stroke="#3f3025" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M19 17c6 2 13 0 19 1" fill="none" stroke="#fff0bc" stroke-width="1.4" stroke-linecap="round" opacity=".56"/>
  <path d="M16 31c4 3 6 8 5 13m25-27c-1 4 0 8 2 11" fill="none" stroke="#6d4329" stroke-width="1.2" stroke-linecap="round" opacity=".65"/>
</svg>
