<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Recruit's Boots</title>
  <defs>
    <linearGradient id="hide" x1="32" y1="7" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76543a"/>
      <stop offset=".42" stop-color="#493528"/>
      <stop offset="1" stop-color="#251d1a"/>
    </linearGradient>
    <linearGradient id="toe" x1="32" y1="39" x2="32" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b402e"/>
      <stop offset=".55" stop-color="#3b2b23"/>
      <stop offset="1" stop-color="#21191a"/>
    </linearGradient>
    <linearGradient id="trim" x1="32" y1="8" x2="32" y2="19" gradientUnits="userSpaceOnUse">
      <stop stop-color="#947052"/>
      <stop offset="1" stop-color="#4a3529"/>
    </linearGradient>
  </defs>

  <!-- The outsole sits behind the leather, leaving only its heavy lower edge exposed. -->
  <path d="M5 51c8 0 17-2 23-5l1 7c-8 4-16 6-24 6-4 0-5-6 0-8Zm54 0c-8 0-17-2-23-5l-1 7c8 4 16 6 24 6 4 0 5-6 0-8Z" fill="#21191a" stroke="#171315" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- A separated pair, with tall shafts and broad outward toes. -->
  <path d="M11 9c7-3 14-3 20 0l-2 34c-1 5-5 8-10 9L6 54c-4 0-5-4-2-7l10-9-3-29Z" fill="url(#hide)" stroke="#20191a" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M34 9c7-3 14-3 20 0l-3 29 10 9c3 3 2 7-2 7l-13-2c-5-1-9-4-10-9L34 9Z" fill="url(#hide)" stroke="#20191a" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M14 38c5 2 10 2 15 0l-1 7c-3 5-8 6-14 7L6 53c-3 0-4-3-1-5l9-10Zm36 0c-5 2-10 2-15 0l1 7c3 5 8 6 14 7l8 1c3 0 4-3 1-5l-9-10Z" fill="url(#toe)"/>

  <!-- Thick cuffs, ankle straps, and brass buckles. -->
  <path d="M10 9c7-4 15-4 22 0l-1 9c-6 3-13 3-19 0l-2-9Zm23 0c7-4 15-4 22 0l-2 9c-6 3-13 3-19 0l-1-9Z" fill="url(#trim)" stroke="#2b201e" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12 25c6 2 12 2 18 0l-1 6c-5 2-11 2-17 0v-6Zm22 0c6 2 12 2 18 0v6c-6 2-12 2-17 0l-1-6Z" fill="#76543a" stroke="#2f231e" stroke-width="1.2"/>
  <path d="M17 25h7v6h-7zm23 0h7v6h-7z" fill="#3b2a22" stroke="#c39a55" stroke-width="1.2"/>
  <path d="M15 13c5 2 9 2 14 0m7 0c5 2 9 2 14 0" fill="none" stroke="#c09a70" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" opacity=".8"/>
</svg>
