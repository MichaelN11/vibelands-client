<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Laundry Wash Paddle</title>
  <defs>
    <linearGradient id="blade" x1="16" y1="10" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0c38c"/>
      <stop offset=".45" stop-color="#b98f56"/>
      <stop offset=".78" stop-color="#7d5631"/>
      <stop offset="1" stop-color="#432c1e"/>
    </linearGradient>
    <linearGradient id="grip" x1="26" y1="40" x2="42" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a97a45"/>
      <stop offset=".55" stop-color="#6d4828"/>
      <stop offset="1" stop-color="#31211a"/>
    </linearGradient>
    <radialGradient id="suds" cx="38%" cy="32%" r="70%">
      <stop stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#d6e7ee"/>
      <stop offset="1" stop-color="#8fa9b6"/>
    </radialGradient>
  </defs>

  <!-- A broad flat beetle for beating wet linen: one wide blade over a short grip. -->
  <path d="M32 5c9 0 16 6 16 15 0 9-4 16-6 21H22c-2-5-6-12-6-21C16 11 23 5 32 5Z" fill="url(#blade)" stroke="#2a1c15" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M32 9c-6 0-11 4-11 11 0 7 3 13 5 18" fill="none" stroke="#f2dcae" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- Grooves across the face are what a real washing bat is for. -->
  <path d="M20 22h24M20 28h24M21 34h22M23 40h18" fill="none" stroke="#4d321f" stroke-width="1.7" stroke-linecap="round" opacity=".78"/>
  <path d="M20 24h24M20 30h24M21 36h22" fill="none" stroke="#e2c48d" stroke-width="1" stroke-linecap="round" opacity=".5"/>

  <path d="M27 41h10l-1 15c0 3-2 5-4 5s-4-2-4-5l-1-15Z" fill="url(#grip)" stroke="#241811" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="M30 45h3l-1 13" fill="none" stroke="#c99a5e" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>
  <path d="M26 41h12" fill="none" stroke="#3b271b" stroke-width="3" stroke-linecap="round"/>

  <!-- Soap lather still clinging to the head, so the tool reads as laundry. -->
  <circle cx="20" cy="14" r="5" fill="url(#suds)" stroke="#7d97a5" stroke-width="1.4" opacity=".92"/>
  <circle cx="27" cy="9" r="3.4" fill="url(#suds)" stroke="#7d97a5" stroke-width="1.2" opacity=".85"/>
  <circle cx="43" cy="17" r="3" fill="url(#suds)" stroke="#7d97a5" stroke-width="1.2" opacity=".8"/>
  <path d="M18 12c1-1 3-1 4 0" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
</svg>
