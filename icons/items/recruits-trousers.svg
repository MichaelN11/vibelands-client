<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Recruit's Trousers</title>
  <defs>
    <linearGradient id="cloth" x1="17" y1="7" x2="48" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8a6946"/>
      <stop offset=".38" stop-color="#5a422e"/>
      <stop offset="1" stop-color="#30241d"/>
    </linearGradient>
    <linearGradient id="reinforcement" x1="20" y1="30" x2="45" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#705237"/>
      <stop offset="1" stop-color="#3b2a20"/>
    </linearGradient>
    <linearGradient id="belt" x1="16" y1="12" x2="47" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#483126"/>
      <stop offset=".5" stop-color="#765036"/>
      <stop offset="1" stop-color="#2c2020"/>
    </linearGradient>
  </defs>

  <!-- High waist and clearly divided legs make the garment read before its small details. -->
  <path d="M15 8c10-3 24-3 34 0l-2 20-3 31H30l-1-25-5 25H10l7-31-2-20Z" fill="url(#cloth)"/>
  <path d="M29 20h7l-1 12-5 7-2-10 1-9Z" fill="#2b211d" opacity=".82"/>
  <path d="m17 28 12 2-5 29H10l7-31Zm19 2 11-2-3 31H30l6-29Z" fill="url(#reinforcement)" opacity=".58"/>

  <!-- Issued belt, brass buckle, knee patches, and stitched cuffs. -->
  <path d="M15 12c11 3 23 3 33 0l-1 8c-10 2-21 2-31 0l-1-8Z" fill="url(#belt)" stroke="#2b2020" stroke-width="1.6"/>
  <path d="M28 13h8v7h-8z" fill="#bd8f45" stroke="#3b2b23" stroke-width="1.3"/>
  <path d="M30 15h4v3h-4z" fill="#432f27"/>
  <path d="m14 38 12 1-2 12-12-1 2-12Zm23 1 9-1-1 12-11 1 3-12Z" fill="#7a5939" stroke="#35261f" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="m16 41 8 1m14 0 6-1M11 55l13 1m7 0 13-1" fill="none" stroke="#b08555" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" opacity=".9"/>
  <!-- Draw the silhouette last so lower-leg overlays cannot cover half its outline. -->
  <path d="M15 8c10-3 24-3 34 0l-2 20-3 31H30l-1-25-5 25H10l7-31-2-20Z" fill="none" stroke="#241c1c" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
