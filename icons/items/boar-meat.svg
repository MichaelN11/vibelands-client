<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Raw Boar Meat</title>
  <defs>
    <linearGradient id="rind" x1="11" y1="12" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe0bf"/>
      <stop offset=".46" stop-color="#efa98f"/>
      <stop offset="1" stop-color="#b85e58"/>
    </linearGradient>
    <radialGradient id="flesh" cx="34%" cy="25%" r="80%">
      <stop stop-color="#ff9a96"/>
      <stop offset=".48" stop-color="#db575d"/>
      <stop offset=".82" stop-color="#a92f42"/>
      <stop offset="1" stop-color="#70243a"/>
    </radialGradient>
    <radialGradient id="bone" cx="34%" cy="24%" r="78%">
      <stop stop-color="#fff9dc"/>
      <stop offset=".63" stop-color="#efd7af"/>
      <stop offset="1" stop-color="#bd826e"/>
    </radialGradient>
    <radialGradient id="marrow" cx="38%" cy="32%" r="72%">
      <stop stop-color="#e9a99c"/>
      <stop offset=".7" stop-color="#b76568"/>
      <stop offset="1" stop-color="#85404f"/>
    </radialGradient>
  </defs>

  <!-- An uneven loin, shoulder lobe, and tapered end keep the cut organic and meaty. -->
  <path d="M7 37c-1-8 3-18 11-24 8-6 18-7 26-3 5 2 7 6 9 10 6 3 9 9 8 16-1 11-11 20-25 25-13 4-25 0-30-8-3-5-3-11 1-16Z" fill="#713040"/>
  <path d="M7 35c0-8 4-17 12-22 8-5 17-6 25-3 5 2 7 6 9 10 6 3 8 9 7 16-1 10-11 19-24 23-12 4-23 0-28-7-3-5-3-11-1-17Z" fill="url(#rind)"/>

  <!-- Ruby-pink flesh and a pale fat cap make the item unmistakably raw. -->
  <path d="M11 35c0-7 4-14 11-18 6-4 14-4 20-2 4 2 6 5 8 9 5 2 7 7 6 12-1 8-9 15-20 19-10 3-19 0-23-6-3-4-3-9-2-14Z" fill="url(#flesh)"/>
  <path d="M8 33c1-8 5-16 12-20 8-5 17-6 25-2 4 1 7 4 9 8-8-5-17-6-25-2-8 3-13 8-16 14-2 4-3 8-1 13-4-3-5-7-4-11Z" fill="#ffe7c5" opacity=".92"/>
  <path d="M12 49c5 6 13 7 23 4 11-3 18-9 20-17 0 9-8 17-20 20-10 3-19 0-23-7Z" fill="#8e2c43" opacity=".7"/>

  <!-- A short curved edge bone reads as a pork chop without becoming a handle. -->
  <path d="M41 15c5 2 8 5 10 10 5 2 7 7 6 12-1 7-7 13-17 17l-3-6c7-3 11-7 12-12 1-4-1-7-5-9-1-4-3-6-7-8l4-4Z" fill="url(#bone)"/>
  <path d="M42 18c4 2 6 5 7 8" fill="none" stroke="#fff7d8" stroke-width="1.7" stroke-linecap="round" opacity=".74"/>
  <path d="M40 50c4-2 7-4 10-7" fill="none" stroke="url(#marrow)" stroke-width="2" stroke-linecap="round" opacity=".7"/>

  <!-- Fine fat seams and wet highlights keep the small icon readable as fresh meat. -->
  <path d="M15 32c4 1 7 4 8 7 2 5 5 8 10 10m-16 2c4-3 8-4 12-4m-6-25c3 2 5 5 6 8" fill="none" stroke="#ffc0ae" stroke-width="2" stroke-linecap="round" opacity=".62"/>
  <path d="M15 27c5-4 11-6 17-6m-19 16c-1 4 0 7 2 9" fill="none" stroke="#ffd1c1" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
  <path d="M35 51c6-2 10-5 13-9" fill="none" stroke="#711f36" stroke-width="1.5" stroke-linecap="round" opacity=".56"/>
</svg>
