<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Apprentice Staff</title>
  <defs>
    <linearGradient id="wood" x1="9" y1="61" x2="51" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28191b"/>
      <stop offset=".28" stop-color="#503024"/>
      <stop offset=".58" stop-color="#98633c"/>
      <stop offset=".82" stop-color="#6a3e2b"/>
      <stop offset="1" stop-color="#342020"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="12" y1="58" x2="50" y2="15" gradientUnits="userSpaceOnUse">
      <stop stop-color="#875336"/>
      <stop offset=".55" stop-color="#c38a52"/>
      <stop offset="1" stop-color="#8a5032"/>
    </linearGradient>
    <radialGradient id="ember" cx="40%" cy="32%" r="65%">
      <stop stop-color="#fffbd2"/>
      <stop offset=".2" stop-color="#ffe66a"/>
      <stop offset=".5" stop-color="#ff9b2f"/>
      <stop offset=".78" stop-color="#e25325"/>
      <stop offset="1" stop-color="#85242a"/>
    </radialGradient>
  </defs>

  <!-- A single thin, curved pole runs almost corner to corner like the equipped basic staff. -->
  <path d="M8 62c-2-2-1-4 1-6 8-7 13-16 21-23 8-8 15-14 19-23l6 3c-4 10-12 18-20 25-8 7-13 17-21 24-2 2-4 2-6 0Z" fill="url(#wood)" stroke="#21161a" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 58c8-8 13-17 21-24 8-7 14-14 18-22" fill="none" stroke="url(#woodLight)" stroke-width="1.7" stroke-linecap="round" opacity=".86"/>
  <path d="M18 52c2 0 4 1 5 3m6-17c2 0 4 1 5 3" fill="none" stroke="#3a2220" stroke-width="1.5" stroke-linecap="round"/>
  <path d="m47 17 7 4 3-6-7-4-3 6Z" fill="#5b3326" stroke="#25191b" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- The warm orange globe sits directly on the tip with no oversized prongs. -->
  <circle cx="53" cy="10" r="8" fill="url(#ember)" stroke="#512027" stroke-width="2.2"/>
  <path d="M49 7c2-3 6-4 9-1" fill="none" stroke="#fff8af" stroke-width="1.6" stroke-linecap="round" opacity=".9"/>
  <circle cx="50.5" cy="6.5" r="1.3" fill="#fffde0"/>
</svg>
