<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Tuskbreaker Axe</title>
  <defs>
    <linearGradient id="steel" x1="13" y1="35" x2="50" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#46505b"/>
      <stop offset=".34" stop-color="#aeb9c2"/>
      <stop offset=".58" stop-color="#e7edf0"/>
      <stop offset="1" stop-color="#606c78"/>
    </linearGradient>
    <linearGradient id="wood" x1="14" y1="58" x2="42" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2c1c1a"/>
      <stop offset=".45" stop-color="#5a3825"/>
      <stop offset=".72" stop-color="#8b5932"/>
      <stop offset="1" stop-color="#3a2520"/>
    </linearGradient>
    <linearGradient id="bone" x1="17" y1="34" x2="47" y2="9" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8e7c62"/>
      <stop offset=".4" stop-color="#e5d8b9"/>
      <stop offset=".7" stop-color="#fff3d0"/>
      <stop offset="1" stop-color="#9a8465"/>
    </linearGradient>
  </defs>

  <!-- The whole weapon is diagonal so the axe head can dominate the inventory square. -->
  <g transform="rotate(28 32 32)">
    <path d="M29 18h7v43h-7Z" fill="url(#wood)" stroke="#23191a" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M30 25h5v31h-5Z" fill="#9a6239" opacity=".45"/>
    <path d="m28 43 9-2m-9 7 9-2m-9 7 9-2" fill="none" stroke="#c0905e" stroke-width="1.4" stroke-linecap="round"/>
    <path d="m28 58 5-3 5 3-2 5h-6l-2-5Z" fill="#4a2c23" stroke="#21171a" stroke-width="1.8"/>

    <!-- A broad classic single-bit head: narrow at the eye, flared into a bowed edge and deep beard. -->
    <path d="M30 11c7 1 12-1 19-4 3 4 4 8 4 13 0 4-2 8-4 12-7-3-13-2-19-4V11Z" fill="url(#steel)" stroke="#252b35" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M49 9c4 6 3 15-1 21" fill="none" stroke="#f7fbff" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>
    <path d="M34 14c5 0 9-2 13-3m-13 8c5 0 9-1 13-3m-13 8c4 0 8 0 12 2" fill="none" stroke="#606b77" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M26 11h9v21h-9Z" fill="#58636e" stroke="#262c34" stroke-width="1.9"/>

    <!-- The boar tusk is now a small hooked trophy, secondary to the axe blade. -->
    <path d="M29 15c-6 1-11 4-15 9 4 1 9-1 13-4l4-2-2-3Z" fill="url(#bone)" stroke="#4b4034" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 23c4-3 8-5 12-6" fill="none" stroke="#fff9df" stroke-width="1.3" stroke-linecap="round" opacity=".85"/>
    <path d="m22 19 2 3" fill="none" stroke="#9d8768" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M27 14h10v15H27z" fill="none" stroke="#6a412b" stroke-width="2.4" stroke-dasharray="3 2"/>
    <path d="M28 17c3 1 6 1 9 0m-9 6c3 1 6 1 9 0" fill="none" stroke="#c58b57" stroke-width="1.2"/>
  </g>
</svg>
