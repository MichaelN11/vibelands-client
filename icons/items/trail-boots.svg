<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Trail Boots</title>
  <defs>
    <linearGradient id="leather" x1="18" y1="8" x2="44" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78543a"/>
      <stop offset=".43" stop-color="#4b3425"/>
      <stop offset="1" stop-color="#271d19"/>
    </linearGradient>
    <linearGradient id="toe" x1="23" y1="36" x2="55" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#765239"/>
      <stop offset=".5" stop-color="#4a3225"/>
      <stop offset="1" stop-color="#281d19"/>
    </linearGradient>
    <linearGradient id="trim" x1="15" y1="10" x2="43" y2="45" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b18b59"/>
      <stop offset=".55" stop-color="#8f6f45"/>
      <stop offset="1" stop-color="#59432e"/>
    </linearGradient>
  </defs>

  <!-- One tall side-profile boot provides the clearest footwear silhouette. -->
  <path d="M14 8c8-3 16-2 22 2l-1 27c6 3 12 6 20 8 4 1 6 4 5 8-1 5-5 7-11 7H9c-6 0-8-6-4-10l11-12-2-30Z" fill="url(#leather)" stroke="#211918" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M33 36c7 4 14 7 23 9 4 1 5 5 2 8-10 3-22 1-30-3-5-4-3-11 5-14Z" fill="url(#toe)" stroke="#38261e" stroke-width="1.1"/>

  <!-- Padded cuff, open tongue, and cross-lacing make it read as a rugged trail boot. -->
  <path d="M13 9c8-4 17-3 24 1l-2 9c-7-3-13-3-20 0l-2-10Z" fill="url(#trim)" stroke="#2c211c" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M20 16c4-2 10-1 14 1l1 24-16-1 1-24Z" fill="#32241d" stroke="#9b754b" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="m20 21 14 5-14 4 14 5-14 4m14-18-14 5 14 4-14 5 14 4" fill="none" stroke="#c09a64" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="20" cy="21" r="1.35" fill="#d1ae73" stroke="#38291f" stroke-width=".7"/>
  <circle cx="34" cy="21" r="1.35" fill="#d1ae73" stroke="#38291f" stroke-width=".7"/>

  <!-- Double stitching and a deep lug sole support the mud-ready description. -->
  <path d="M8 50c14 3 31 3 50 0 1 4-1 8-7 10H9c-5 0-7-6-1-10Z" fill="#211918" stroke="#171314" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M10 51c13 2 28 2 44 0" fill="none" stroke="#b58b58" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2 2"/>
  <path d="M13 54h8l-2 5h-8m12-5h8l-1 5h-9m12-5h9l1 5H32m13-5h10l-3 5h-8" fill="#151213"/>
  <path d="M16 42c6 2 12 2 18 0" fill="none" stroke="#c49b62" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2 2"/>
</svg>
