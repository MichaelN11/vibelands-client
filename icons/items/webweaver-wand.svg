<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Webweaver Wand</title>
  <defs>
    <linearGradient id="chitin" x1="15" y1="56" x2="49" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#211b2a"/>
      <stop offset=".4" stop-color="#3a3145"/>
      <stop offset=".68" stop-color="#6c5977"/>
      <stop offset="1" stop-color="#282030"/>
    </linearGradient>
    <linearGradient id="silk" x1="20" y1="43" x2="49" y2="13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#756d7b"/>
      <stop offset=".5" stop-color="#d7d0d7"/>
      <stop offset="1" stop-color="#fff8ef"/>
    </linearGradient>
    <radialGradient id="venom" cx="36%" cy="30%" r="68%">
      <stop stop-color="#fff0da"/>
      <stop offset=".18" stop-color="#ffae87"/>
      <stop offset=".48" stop-color="#d94a3a"/>
      <stop offset="1" stop-color="#641c2b"/>
    </radialGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="1.35"/>
    </filter>
  </defs>

  <g transform="rotate(38 32 32)">
    <!-- A short, segmented chitin shaft reads as a wand rather than a full staff. -->
    <path d="M28 23h8v38h-8Z" fill="url(#chitin)" stroke="#201927" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M30 27h3v29h-3Z" fill="#8b7694" opacity=".4"/>
    <path d="M27 31h10v5H27zm0 10h10v5H27zm0 10h10v5H27z" fill="#241d2d" stroke="#76657e" stroke-width="1"/>
    <path d="m27 58 5-3 5 3-2 5h-6l-2-5Z" fill="#2a2133" stroke="#1b1620" stroke-width="1.7"/>

    <!-- Spider-leg prongs hold a bright red focus inside a small web. -->
    <circle cx="32" cy="17" r="10" fill="#d94a3a" opacity=".2" filter="url(#glow)"/>
    <path d="M32 24 20 16m12 8 12-8M30 21 22 7m12 14L42 7M29 17H18m17 0h11" fill="none" stroke="#4b3a56" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 20 23 15m9 5 9-5m-11 1-5-7m9 7 5-7M28 13h-7m15 0h7" fill="none" stroke="url(#silk)" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M25 15c2-3 4-5 7-6m7 6c-2-3-4-5-7-6M28 19c-2-1-4-2-6-2m14 2c2-1 4-2 6-2" fill="none" stroke="#e3dce4" stroke-width="1" stroke-linecap="round"/>
    <ellipse cx="32" cy="17" rx="6" ry="7" fill="url(#venom)" stroke="#4e1c2c" stroke-width="1.8"/>
    <path d="M29 14c1-2 4-3 6-1" fill="none" stroke="#fff0dc" stroke-width="1.3" stroke-linecap="round"/>
    <circle cx="30" cy="13" r="1" fill="#fff"/>

    <!-- Bone-white silk wraps mark the grip without hiding the segmented construction. -->
    <path d="m27 38 10 3m-10 2 10 3m-10 2 10 3" fill="none" stroke="url(#silk)" stroke-width="1.7" stroke-linecap="round"/>
  </g>
</svg>
