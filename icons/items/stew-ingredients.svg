<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Tied Bundle of Stew Ingredients</title>
  <defs>
    <linearGradient id="cloth" x1="15" y1="24" x2="49" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d2af73"/>
      <stop offset=".52" stop-color="#8f643b"/>
      <stop offset="1" stop-color="#4a3025"/>
    </linearGradient>
    <linearGradient id="carrot" x1="22" y1="12" x2="29" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e7a53e"/>
      <stop offset=".58" stop-color="#b85c27"/>
      <stop offset="1" stop-color="#6f3422"/>
    </linearGradient>
    <radialGradient id="turnip" cx="34%" cy="25%" r="82%">
      <stop stop-color="#f3deb0"/>
      <stop offset=".6" stop-color="#c6a26f"/>
      <stop offset="1" stop-color="#745238"/>
    </radialGradient>
    <linearGradient id="greens" x1="31" y1="8" x2="40" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9eb85d"/>
      <stop offset=".55" stop-color="#55753b"/>
      <stop offset="1" stop-color="#29452f"/>
    </linearGradient>
    <linearGradient id="meat" x1="39" y1="19" x2="50" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e48779"/>
      <stop offset=".55" stop-color="#a84248"/>
      <stop offset="1" stop-color="#602b37"/>
    </linearGradient>
  </defs>

  <!-- Root vegetables and herbs rise above the tied cloth, keeping the contents visibly uncooked. -->
  <path d="M22 31 17 14c-1-4 2-6 5-3l5 4 1-7c1-4 5-4 6 0l1 8 5-7c3-3 6-1 5 3l-4 18H22Z" fill="#24382c" stroke="#211c1c" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M27 27c-6-4-9-11-7-16 5 1 8 6 9 13M33 28c-2-8-1-14 0-20 5 4 6 11 3 19m3 2c0-8 2-14 6-17 2 6-1 13-4 18" fill="url(#greens)" stroke="#314b31" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m18 18 5-4m11 0 5-4m-6 10 5-1" fill="none" stroke="#bed071" stroke-width="1.4" stroke-linecap="round" opacity=".72"/>

  <path d="M16 34c-1-8 3-13 9-13 5 0 8 3 8 8l-3 14-14-9Z" fill="url(#carrot)" stroke="#542d24" stroke-width="2" stroke-linejoin="round"/>
  <path d="M21 25c3-1 6 0 8 2m-9 4 9 2m-7 4 6 1" fill="none" stroke="#f2bd5f" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
  <path d="M31 28c2-7 8-10 13-7 6 3 7 10 3 16-3 5-9 8-14 5-5-2-5-8-2-14Z" fill="url(#turnip)" stroke="#503628" stroke-width="2"/>
  <path d="M35 25c4-2 8-1 10 2" fill="none" stroke="#fff0c1" stroke-width="1.8" stroke-linecap="round" opacity=".7"/>
  <path d="M42 22c4-2 9 1 10 6 1 4-1 9-5 12l-8-5 3-13Z" fill="url(#meat)" stroke="#4b2730" stroke-width="2" stroke-linejoin="round"/>
  <path d="M45 25c3 0 5 2 5 5" fill="none" stroke="#ffc1a8" stroke-width="1.5" stroke-linecap="round" opacity=".75"/>

  <!-- A gathered sack makes the icon read as one portable bundle rather than loose produce. -->
  <path d="M12 31c6-4 13-5 20-2 8-3 16-2 21 3l-4 23c-9 6-26 7-35 0l-2-24Z" fill="#30231f" stroke="#21191a" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M14 31c7 3 13 3 18 0 6 3 12 3 19 0l-4 22c-8 5-23 6-31 0l-2-22Z" fill="url(#cloth)"/>
  <path d="M14 32c6 4 12 4 18 0 6 4 13 4 19 0" fill="none" stroke="#e6c88b" stroke-width="2" stroke-linecap="round"/>
  <path d="M14 38c10 4 26 4 36 0" fill="none" stroke="#503226" stroke-width="4" stroke-linecap="round"/>
  <path d="M30 35c-4 0-7 3-8 7 4 1 8-1 10-4 2 3 6 5 10 4-1-4-4-7-8-7h-4Z" fill="#b98245" stroke="#4b3025" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M18 45c8 3 20 3 28 0M20 51c7 3 17 3 24 0" fill="none" stroke="#dbb97a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2" opacity=".75"/>
</svg>
