<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Linenkeep Hood</title>
  <defs>
    <linearGradient id="cloth" x1="17" y1="8" x2="47" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7fa8ac"/>
      <stop offset=".32" stop-color="#4e7d87"/>
      <stop offset=".7" stop-color="#31555f"/>
      <stop offset="1" stop-color="#1d3037"/>
    </linearGradient>
    <linearGradient id="clothLight" x1="18" y1="14" x2="34" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a9cbcb"/>
      <stop offset=".55" stop-color="#5d8d94"/>
      <stop offset="1" stop-color="#2f545e"/>
    </linearGradient>
    <linearGradient id="linen" x1="20" y1="21" x2="45" y2="51" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4ecd8"/>
      <stop offset=".45" stop-color="#d3c5a5"/>
      <stop offset="1" stop-color="#8b7d63"/>
    </linearGradient>
    <radialGradient id="opening" cx="48%" cy="40%" r="65%">
      <stop stop-color="#22343a"/>
      <stop offset="1" stop-color="#111a1e"/>
    </radialGradient>
  </defs>

  <!-- Plain working hood with a short mantle: house cloth, not a mage's silk. -->
  <path d="M10 60c1-8 6-14 12-19h20c6 5 11 11 12 19-8-3-16-4-22-2-6-2-14-1-22 2Z" fill="url(#cloth)" stroke="#152229" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M14 56c5-4 11-6 18-5 7-1 13 1 18 5" fill="none" stroke="#93bec2" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>
  <path d="M15 42C12 22 20 8 32 3c12 5 20 19 17 39l-7 9H22l-7-9Z" fill="url(#cloth)" stroke="#152229" stroke-width="2.7" stroke-linejoin="round"/>
  <path d="M19 40C17 24 23 12 32 7c1 14 0 28-4 42l-5 .5-4-9.5Z" fill="url(#clothLight)" opacity=".76"/>
  <path d="M32 5c3 8 3 13 0 17" fill="none" stroke="#a5cfd1" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>

  <!-- Bleached linen lining turned back at the face, and a plain hem band. -->
  <path d="M21 26c2.2-7 6-11 11-13 5 2 8.8 6 11 13l-3.4 17c-5 3.6-10 3.6-15 0L21 26Z" fill="url(#opening)" stroke="url(#linen)" stroke-width="3" stroke-linejoin="round"/>
  <path d="M23.4 25c2-5 5-8 8.6-9.4 3.6 1.4 6.6 4.4 8.6 9.4" fill="none" stroke="#fbf4e2" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>
  <path d="M19 46c7 3 19 3 26 0l3 5c-9 5-23 5-32 0l3-5Z" fill="url(#linen)" stroke="#5f5643" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M23.5 47c5 1.4 12 1.4 17 0" fill="none" stroke="#fffaea" stroke-width="1" stroke-linecap="round" opacity=".75"/>

  <!-- Honest mended stitching rather than an enchantment. -->
  <path d="m15 49 3 2m31-2-3 2M15.5 35l3 1m30-1-3 1" fill="none" stroke="#dfd3b4" stroke-width="1.4" stroke-linecap="round"/>
  <path d="m26 32 2 3 2-3 2 3" fill="none" stroke="#cfe2e0" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>
</svg>
