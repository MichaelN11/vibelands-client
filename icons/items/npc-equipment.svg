<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">NPC Equipment Placeholder</title>
  <defs>
    <linearGradient id="cloth" x1="18" y1="17" x2="46" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8d8495"/>
      <stop offset=".48" stop-color="#5e5667"/>
      <stop offset="1" stop-color="#342f3b"/>
    </linearGradient>
    <linearGradient id="trim" x1="22" y1="22" x2="43" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c0a875"/>
      <stop offset="1" stop-color="#6f5b3c"/>
    </linearGradient>
    <linearGradient id="metal" x1="28" y1="4" x2="38" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7d3dc"/>
      <stop offset="1" stop-color="#777181"/>
    </linearGradient>
  </defs>

  <!-- A broad hanger and tunic silhouette stay legible when reduced to inventory size. -->
  <path d="M31 15v-2c0-2 5-2 5-6 0-2-2-3-4-3-3 0-5 2-5 5" fill="none" stroke="url(#metal)" stroke-width="3" stroke-linecap="round"/>
  <path d="m31 14-18 11c-2 1-1 4 1 4h36c2 0 3-3 1-4L34 14h-3Z" fill="#4a4452" stroke="#25212b" stroke-width="2.3" stroke-linejoin="round"/>
  <path d="m26 17-13 8m25-8 13 8" fill="none" stroke="#b7b0bf" stroke-width="1.3" stroke-linecap="round" opacity=".72"/>

  <!-- Neutral cloth and a plain reinforced panel identify this as generic, non-player equipment. -->
  <path d="m22 20-11 7-6 12 8 6 6-8-2 22h30l-2-22 6 8 8-6-6-12-11-7c-2 4-6 6-10 6s-8-2-10-6Z" fill="url(#cloth)" stroke="#25212b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M22 20c2 6 6 9 10 9s8-3 10-9l-5-3c-1 3-3 4-5 4s-4-1-5-4l-5 3Z" fill="#302b36" stroke="url(#trim)" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M22 35h20l2 19-12 4-12-4 2-19Z" fill="#4a4352" stroke="#29242e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M22 36c6 2 14 2 20 0M32 37v18" fill="none" stroke="#a69dac" stroke-width="1.2" stroke-linecap="round" opacity=".58"/>
  <path d="M17 48c9 3 21 3 30 0" fill="none" stroke="url(#trim)" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="32" cy="42" r="2.4" fill="#bea56f" stroke="#4d402e" stroke-width="1"/>
</svg>
