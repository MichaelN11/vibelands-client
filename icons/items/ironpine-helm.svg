<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Ironpine Helm</title>
  <defs>
    <linearGradient id="leather" x1="17" y1="10" x2="45" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a27445"/>
      <stop offset=".34" stop-color="#704b2f"/>
      <stop offset=".72" stop-color="#422c25"/>
      <stop offset="1" stop-color="#241a1d"/>
    </linearGradient>
    <linearGradient id="steel" x1="22" y1="8" x2="42" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e1e8ec"/>
      <stop offset=".22" stop-color="#9da9b3"/>
      <stop offset=".55" stop-color="#5d6874"/>
      <stop offset=".82" stop-color="#303944"/>
      <stop offset="1" stop-color="#1d252e"/>
    </linearGradient>
    <linearGradient id="edge" x1="11" y1="30" x2="53" y2="43" gradientUnits="userSpaceOnUse">
      <stop stop-color="#596570"/>
      <stop offset=".48" stop-color="#c4cdd3"/>
      <stop offset="1" stop-color="#434d59"/>
    </linearGradient>
  </defs>

  <!-- Front-facing boiled-leather cap with a reinforced ironpine frame. -->
  <path d="M11 31C11 15 19 6 32 6s21 9 21 25l-3 7-8-4H22l-8 4-3-7Z" fill="url(#leather)" stroke="#211a1e" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M17 28c1-11 6-17 15-17s14 6 15 17" fill="none" stroke="#c1935b" stroke-width="1.5" stroke-linecap="round" opacity=".72"/>
  <path d="M32 7v28" fill="none" stroke="url(#steel)" stroke-width="5" stroke-linecap="round"/>
  <path d="M14 29c10-3 26-3 36 0l2 7c-12-4-28-4-40 0l2-7Z" fill="url(#edge)" stroke="#222933" stroke-width="2" stroke-linejoin="round"/>
  <path d="M16 30c10-2.4 22-2.4 32 0" fill="none" stroke="#edf3f5" stroke-width="1.2" stroke-linecap="round" opacity=".72"/>

  <!-- Long nasal and articulated cheek plates make this read as armor, not a cap. -->
  <path d="m28.8 28.5 3.2-2 3.2 2-1.2 20-2 5-2-5-1.2-20Z" fill="url(#steel)" stroke="#222933" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="m12.5 34 10-2.6 3.8 5.2-4.4 19-8.2-5.7-1.2-15.9Z" fill="url(#leather)" stroke="#211a1e" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="m51.5 34-10-2.6-3.8 5.2 4.4 19 8.2-5.7L51.5 34Z" fill="url(#leather)" stroke="#211a1e" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="m16 36 5.8-1.5-2.9 15.8M48 36l-5.8-1.5 2.9 15.8" fill="none" stroke="#b9854c" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>
  <path d="M22.5 38.5 26 40v4l-4.5-1M41.5 38.5 38 40v4l4.5-1" fill="none" stroke="#cbd4da" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="17" cy="38" r="1.5" fill="#b9c3ca" stroke="#303843" stroke-width=".8"/>
  <circle cx="47" cy="38" r="1.5" fill="#b9c3ca" stroke="#303843" stroke-width=".8"/>
</svg>
