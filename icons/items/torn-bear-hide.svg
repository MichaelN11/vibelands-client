<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Torn Bear Hide</title>
  <defs>
    <linearGradient id="bear-fur" x1="18" y1="6" x2="48" y2="61" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9a7049"/>
      <stop offset=".38" stop-color="#714a30"/>
      <stop offset=".74" stop-color="#4b3025"/>
      <stop offset="1" stop-color="#281d1b"/>
    </linearGradient>
    <linearGradient id="underfur" x1="26" y1="27" x2="39" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b58a5b"/>
      <stop offset=".52" stop-color="#7d5437"/>
      <stop offset="1" stop-color="#432b23"/>
    </linearGradient>
    <radialGradient id="muzzle" cx="42%" cy="28%" r="80%">
      <stop stop-color="#c29a6b"/>
      <stop offset=".62" stop-color="#8b6242"/>
      <stop offset="1" stop-color="#563a2c"/>
    </radialGradient>
  </defs>

  <!-- Broad shoulders and heavy, splayed paws give the hide a bear-like weight. -->
  <path d="M22 25C16 27 10 30 7 35L3 45l8 5 8-9-2 11-7 6 11 3 7-10 4 7 4-7 7 10 11-3-7-7-2-10 8 9 8-5-5-10c-3-5-9-8-15-10H22Z" fill="url(#bear-fur)" stroke="#2b211e" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M24 30c-3 7-2 15 4 23l4 5 4-5c6-8 7-16 4-23l-8-4-8 4Z" fill="url(#underfur)" stroke="#50382b" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Small high-set ears, a broad skull, and a short heavy muzzle read as bear. -->
  <circle cx="21" cy="9" r="5.2" fill="#68442f" stroke="#2b211e" stroke-width="2.3"/>
  <circle cx="43" cy="9" r="5.2" fill="#68442f" stroke="#2b211e" stroke-width="2.3"/>
  <circle cx="21" cy="9" r="2.2" fill="#342522"/>
  <circle cx="43" cy="9" r="2.2" fill="#342522"/>
  <path d="M17 13C18 6 23 3 32 3s14 3 15 10l-2 13c-2 7-7 10-13 10s-11-3-13-10l-2-13Z" fill="url(#bear-fur)" stroke="#2b211e" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M20 15c3-5 7-7 12-7s9 2 12 7l-2 10c-2 6-5 8-10 9-5-1-8-3-10-9l-2-10Z" fill="#765039" opacity=".64"/>
  <path d="m23 14 5-1m13 1-5-1" fill="none" stroke="#3b2922" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="26" cy="16" r="1.5" fill="#211a18"/>
  <circle cx="38" cy="16" r="1.5" fill="#211a18"/>
  <path d="M22 22c0-4 4-6 10-6s10 2 10 6c0 5-4 8-10 9-6-1-10-4-10-9Z" fill="url(#muzzle)"/>
  <path d="m27 21 5-2 5 2-2 4-3 1-3-1-2-4Z" fill="#211918"/>
  <path d="M32 25v4m0-1-4 2m4-2 4 2" fill="none" stroke="#35251f" stroke-width="1.35" stroke-linecap="round"/>

  <!-- Missing chunks, exposed leather, and slash marks make the damaged condition clear. -->
  <path d="m27 38 4-4 5 3-1 5 4 3-4 6-5-2-3 4-4-6 4-4-2-3 2-2Z" fill="#80634d" stroke="#3b302a" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M28 38c2 2 5 2 7 0m-9 10c3-2 6-1 9 1" fill="none" stroke="#c49b6d" stroke-width="1.1" stroke-linecap="round"/>
  <path d="m8 37 6 2-5 5m9 7 5-2-3 7m26-19-6 2 5 5m1 7-5-2 3 7" fill="none" stroke="#b98b5e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" opacity=".82"/>
  <path d="m14 31 5 3m30-3-5 3M20 28l3 4m21-4-3 4" fill="none" stroke="#d0a475" stroke-width="1.2" stroke-linecap="round" opacity=".66"/>
</svg>
