<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Wanderer's Gloves</title>
  <defs>
    <linearGradient id="leather" x1="16" y1="13" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9d774b"/>
      <stop offset=".42" stop-color="#65482f"/>
      <stop offset="1" stop-color="#32251e"/>
    </linearGradient>
    <linearGradient id="worn" x1="24" y1="27" x2="42" y2="47" gradientUnits="userSpaceOnUse">
      <stop stop-color="#bd9664"/>
      <stop offset="1" stop-color="#7c5b3d"/>
    </linearGradient>
    <linearGradient id="cuff" x1="17" y1="44" x2="46" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7d5d3d"/>
      <stop offset="1" stop-color="#3e2d22"/>
    </linearGradient>
  </defs>

  <!-- A single open glove uses one continuous leather silhouette, avoiding bare-hand fingertips. -->
  <path d="m19 31-3-13c-1-4 0-6 3-7 3 0 5 2 6 6l1 8-1-14c0-4 2-7 5-7 4 0 6 3 6 7v14l2-12c1-4 3-6 6-5 4 1 5 3 4 8l-3 12 4-8c2-4 5-5 8-2 2 2 1 6 0 9l-8 18c-2 6-7 10-15 11-8 0-14-4-18-11L8 34c-3-4-2-8 1-10 3-1 6 1 8 4l2 3Z" fill="url(#leather)" stroke="#281e1a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Finger seams define four properly proportioned glove fingers and the folded thumb. -->
  <path d="m26 26-2-9m12 9V11m9 18 3-13m-29 16 7 7" fill="none" stroke="#c39a64" stroke-width="1.35" stroke-linecap="round" opacity=".82"/>
  <path d="M20 29c7-5 19-6 27 0l1 13c-3 8-8 12-15 12-8 0-14-5-17-12l4-13Z" fill="#61442e" stroke="#35261e" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- The pale, polished palm is the named item's defining detail. -->
  <path d="M24 31c5-4 13-3 17 2l2 9c-2 5-6 8-11 8-6-1-10-4-11-10l3-9Z" fill="url(#worn)" stroke="#513923" stroke-width="1.3"/>
  <path d="M27 34c4-2 9-1 12 2m-14 3c4-2 11-1 15 2m-13 4c3 1 6 2 9 1" fill="none" stroke="#dfbd88" stroke-width="1.2" stroke-linecap="round" opacity=".78"/>
  <path d="m18 47 25-2 5 14H17l1-12Z" fill="url(#cuff)" stroke="#281e1a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="m20 49 23-2 2 6-27 2 2-6Z" fill="#8a6944" stroke="#3d2d22" stroke-width="1.1"/>
  <path d="m23 53 17-2" fill="none" stroke="#d1aa6c" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
</svg>
