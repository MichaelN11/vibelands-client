<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Raidmaster Throm's Severed Head</title>
  <defs>
    <linearGradient id="skin" x1="20" y1="15" x2="43" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9eaa58"/>
      <stop offset=".45" stop-color="#66763e"/>
      <stop offset="1" stop-color="#34432f"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="27" y1="35" x2="38" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#899653"/>
      <stop offset="1" stop-color="#4a5937"/>
    </linearGradient>
    <linearGradient id="hair" x1="25" y1="5" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4b3932"/>
      <stop offset="1" stop-color="#211f20"/>
    </linearGradient>
    <linearGradient id="tusk" x1="26" y1="43" x2="39" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff0bd"/>
      <stop offset="1" stop-color="#9c835b"/>
    </linearGradient>
  </defs>

  <!-- A coarse war crest and wide pointed ears give the raidmaster a forceful orc silhouette. -->
  <path d="m25 18 1-9 4 3 3-7 3 7 5-3-2 11Z" fill="url(#hair)" stroke="#242122" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M21 23 8 18l5 14 9 4m21-13 13-5-5 14-9 4" fill="url(#skin)" stroke="#293127" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m11 21 8 6-6 2m40-8-8 6 6 2" fill="none" stroke="#b0b76b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity=".62"/>

  <!-- Heavy cheeks, low brow, and a square jaw keep the face readable at inventory scale. -->
  <path d="M22 17c6-5 15-5 21 1 5 5 6 15 4 23-1 6-5 12-10 16l-5 3-6-3c-6-4-9-10-10-17-1-9 1-18 6-23Z" fill="url(#skin)" stroke="#293127" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M22 26c3-4 7-5 10-2 4-3 9-2 12 2l-3 5-8-1-9 2-2-6Z" fill="#3f4d31" opacity=".82"/>
  <path d="m22 25 8 1m13-1-8 1" fill="none" stroke="#252a25" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 28h2m9 0h2" fill="none" stroke="#f0b744" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M31 28c-1 4-3 8-2 11l3 2 4-2c1-3-1-7-2-11" fill="#52613a" stroke="#34402e" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M29 38c2 1 5 1 7 0" fill="none" stroke="#b4bd70" stroke-width="1.3" stroke-linecap="round" opacity=".62"/>

  <!-- Upturned tusks and a restrained red raid-mark make this a named quest trophy. -->
  <path d="M22 40c2-3 6-4 10-2 4-2 9-1 11 2l-2 10-9 6-9-6-1-10Z" fill="url(#muzzle)" stroke="#33402e" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M24 43c5 2 12 2 17 0l-3 8-6 3-6-3-2-8Z" fill="#312928" stroke="#272425" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="m25 47 1-8c4 3 5 7 3 11Zm14 0-1-8c-4 3-5 7-3 11Z" fill="url(#tusk)" stroke="#5b4e3d" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M29 48c2 1 5 1 7 0" fill="none" stroke="#816758" stroke-width="1.3" stroke-linecap="round"/>
  <path d="m21 18 7 5-4 5 5 3-4 5" fill="none" stroke="#9f3e32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m41 18-3 3m4 0-3 3" fill="none" stroke="#c1c67d" stroke-width="1.3" stroke-linecap="round" opacity=".66"/>

  <!-- A small, dark jagged neck break signals the severed trophy without overt gore. -->
  <path d="m25 55 4 2 3-2 4 2 3-3 1 5-7 2-9-2 1-4Z" fill="#4f2d2a" stroke="#292527" stroke-width="2" stroke-linejoin="round"/>
  <path d="m28 58 4-1 4 1" fill="none" stroke="#a85a44" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>
</svg>
