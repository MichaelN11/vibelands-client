<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Stiff Scrub Brush</title>
  <defs>
    <linearGradient id="block" x1="12" y1="14" x2="52" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e3c68f"/>
      <stop offset=".42" stop-color="#b78c55"/>
      <stop offset=".76" stop-color="#7a5430"/>
      <stop offset="1" stop-color="#3f2a1d"/>
    </linearGradient>
    <linearGradient id="bristle" x1="16" y1="36" x2="48" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7a758"/>
      <stop offset=".5" stop-color="#9a6c34"/>
      <stop offset="1" stop-color="#4b3320"/>
    </linearGradient>
    <radialGradient id="foam" cx="36%" cy="30%" r="72%">
      <stop stop-color="#ffffff"/>
      <stop offset=".62" stop-color="#dae9ef"/>
      <stop offset="1" stop-color="#93aab6"/>
    </radialGradient>
  </defs>

  <!-- One shaped wooden back with a waisted grip, bristles hanging beneath it. -->
  <path d="M11 26c0-6 5-10 12-10h18c7 0 12 4 12 10 0 5-3 9-8 10H19c-5-1-8-5-8-10Z" fill="url(#block)" stroke="#2a1c14" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M15 24c1-3 4-5 8-5h18c4 0 7 2 8 5" fill="none" stroke="#f4dcaa" stroke-width="2" stroke-linecap="round" opacity=".72"/>
  <path d="M18 30h28" fill="none" stroke="#553a24" stroke-width="1.4" stroke-linecap="round" opacity=".65"/>
  <!-- Two set holes in the back, where the bristle tufts are drawn through. -->
  <ellipse cx="24" cy="27" rx="3" ry="2" fill="#4b3220" opacity=".55"/>
  <ellipse cx="40" cy="27" rx="3" ry="2" fill="#4b3220" opacity=".55"/>

  <path d="M17 36h30l-2 6H19l-2-6Z" fill="#5c3f26" stroke="#241810" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M20 42h24l-2 15H22l-2-15Z" fill="url(#bristle)" stroke="#241810" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M24 43v13m4-13v14m4-14v14m4-14v14m4-14v13" fill="none" stroke="#3a2717" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <path d="M26 44v11m8-11v11" fill="none" stroke="#e6b56a" stroke-width="1.1" stroke-linecap="round" opacity=".7"/>

  <!-- Lather still worked into the bristles. -->
  <circle cx="47" cy="19" r="4.4" fill="url(#foam)" stroke="#7f98a6" stroke-width="1.4" opacity=".92"/>
  <circle cx="54" cy="25" r="2.8" fill="url(#foam)" stroke="#7f98a6" stroke-width="1.2" opacity=".85"/>
  <circle cx="14" cy="47" r="3.2" fill="url(#foam)" stroke="#7f98a6" stroke-width="1.2" opacity=".8"/>
  <path d="M45 17c1-1 3-1 4 0" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
</svg>
