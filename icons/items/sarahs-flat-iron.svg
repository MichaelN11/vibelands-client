<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Cast Flat Iron</title>
  <defs>
    <linearGradient id="cast" x1="12" y1="30" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6f7681"/>
      <stop offset=".34" stop-color="#454c56"/>
      <stop offset=".72" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#171b21"/>
    </linearGradient>
    <linearGradient id="sole" x1="14" y1="48" x2="50" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c3ccd4"/>
      <stop offset=".5" stop-color="#8d97a2"/>
      <stop offset="1" stop-color="#4a525c"/>
    </linearGradient>
    <linearGradient id="handle" x1="20" y1="10" x2="44" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a8763f"/>
      <stop offset=".5" stop-color="#6c4626"/>
      <stop offset="1" stop-color="#2f2018"/>
    </linearGradient>
  </defs>

  <!-- A sad-iron seen three-quarters: pointed nose left, arched handle over the body. -->
  <path d="M9 47c6-8 15-13 27-13h13c4 0 6 2 6 5v6c0 3-2 5-6 5H14c-4 0-6-1-5-3Z" fill="url(#cast)" stroke="#12161b" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M13 43c6-5 13-8 22-8h12" fill="none" stroke="#98a2ae" stroke-width="2" stroke-linecap="round" opacity=".72"/>
  <path d="M10 50h45v3H10Z" fill="url(#sole)" stroke="#141920" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M13 51h38" fill="none" stroke="#e4edf3" stroke-width="1.1" stroke-linecap="round" opacity=".8"/>

  <!-- Cast posts and a turned wooden grip: the part that says "iron" at 32 px. -->
  <path d="M20 34h5v-5h-5Zm22 0h5v-5h-5Z" fill="#3a4149" stroke="#12161b" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M19 30c0-9 5-14 13-14s13 5 13 14h-6c0-6-3-9-7-9s-7 3-7 9h-6Z" fill="url(#handle)" stroke="#1d1410" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M24 26c1-5 4-7 8-7s7 2 8 7" fill="none" stroke="#cb9856" stroke-width="1.5" stroke-linecap="round" opacity=".8"/>
  <path d="M28 20c2-1 6-1 8 0" fill="none" stroke="#e0b378" stroke-width="1.2" stroke-linecap="round" opacity=".7"/>

  <!-- Scorch and a chipped nose: it has been left on a stove and dropped since. -->
  <path d="M11 46c4-1 8-1 11 0" fill="none" stroke="#8c6a45" stroke-width="1.6" stroke-linecap="round" opacity=".7"/>
  <path d="M38 41h11m-13 4h13" fill="none" stroke="#6a727d" stroke-width="1.3" stroke-linecap="round" opacity=".6"/>
</svg>
