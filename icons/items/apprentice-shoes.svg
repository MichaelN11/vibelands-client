<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Apprentice Shoes</title>
  <defs>
    <linearGradient id="leather" x1="19" y1="14" x2="44" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9b5540"/>
      <stop offset=".48" stop-color="#613229"/>
      <stop offset="1" stop-color="#291b20"/>
    </linearGradient>
    <linearGradient id="toe" x1="12" y1="38" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c26b46"/>
      <stop offset=".45" stop-color="#71372d"/>
      <stop offset="1" stop-color="#321e22"/>
    </linearGradient>
    <linearGradient id="gold" x1="20" y1="25" x2="44" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f4c56c"/>
      <stop offset=".5" stop-color="#b87335"/>
      <stop offset="1" stop-color="#633827"/>
    </linearGradient>
  </defs>

  <!-- One oversized side-profile shoe stays readable where a tiny pair looked like goggles. -->
  <path d="M12 13c8-4 17-2 22 4l-3 16c7 5 14 8 23 10 4 1 6 4 5 8-1 5-5 8-10 8H9c-6 0-8-6-4-10l10-11-3-25Z" fill="url(#leather)" stroke="#291a20" stroke-width="2.6" stroke-linejoin="round"/>
  <path d="M29 34c8 5 16 8 26 10 4 1 5 5 2 8-9 3-20 2-29-2-5-3-6-10 1-16Z" fill="url(#toe)"/>

  <!-- Dark ankle opening, broad sole, and a single strap establish the footwear anatomy. -->
  <path d="M14 15c6-3 13-2 18 2l-2 9c-5-4-10-4-15-1l-1-10Z" fill="#291b21" stroke="#bc6842" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="m15 29 18 7" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M22 29h8v8h-8z" fill="#48241f" stroke="#e1a950" stroke-width="1.5" transform="rotate(20 26 33)"/>
  <path d="M6 51c14 3 31 3 51 0 0 5-3 8-9 9H9c-4 0-6-5-3-9Z" fill="#24191c" stroke="#1c1519" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M12 53h36" fill="none" stroke="#b86b45" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3" opacity=".78"/>
  <path d="M51 43c5 1 8-1 9-5 2 6 1 11-4 14l-7-4 2-5Z" fill="url(#toe)" stroke="#291a20" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M54 45c3 0 4-2 5-4" fill="none" stroke="#e18a52" stroke-width="1.4" stroke-linecap="round" opacity=".72"/>
</svg>
