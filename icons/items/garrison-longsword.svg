<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Garrison Longsword</title>
  <defs>
    <linearGradient id="steel" x1="17" y1="49" x2="51" y2="6" gradientUnits="userSpaceOnUse">
      <stop stop-color="#526274"/>
      <stop offset=".24" stop-color="#aebdca"/>
      <stop offset=".48" stop-color="#f7fbff"/>
      <stop offset=".68" stop-color="#cbd8e2"/>
      <stop offset="1" stop-color="#728396"/>
    </linearGradient>
    <linearGradient id="gold" x1="18" y1="40" x2="40" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe18a"/>
      <stop offset=".4" stop-color="#c58b32"/>
      <stop offset=".72" stop-color="#825226"/>
      <stop offset="1" stop-color="#422d24"/>
    </linearGradient>
    <linearGradient id="grip" x1="19" y1="48" x2="28" y2="59" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a66d3e"/>
      <stop offset=".58" stop-color="#593323"/>
      <stop offset="1" stop-color="#2a1b20"/>
    </linearGradient>
  </defs>

  <!-- One imposing garrison sword, distinct from the crossed-swords emoji it replaces. -->
  <g transform="translate(3.2 3.2) scale(.9) rotate(39 32 32)">
    <path d="M32-4 38.6 6.5 35.5 46h-7L25.4 6.5 32-4Z" fill="url(#steel)" stroke="#1d2633" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="M32-1v45" fill="none" stroke="#58697a" stroke-width="1.2"/>
    <path d="m32-1-1.2 45h-2L27.5 7.5 32-1Z" fill="#fff" opacity=".7"/>
    <path d="M34.2 4.5 36.4 8l-2.8 33.5" fill="none" stroke="#e7f3fb" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>

    <!-- Broad winged guard and reinforced rain-guard sell the longsword silhouette. -->
    <path d="m26.8 44 2.1-3.6h6.2l2.1 3.6-.9 4h-8.6l-.9-4Z" fill="url(#gold)" stroke="#35242a" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m14 44 4.2-3.8 11.2 3.7h5.2l11.2-3.7L50 44l-6.1 5-9.4-2h-5l-9.4 2-6.1-5Z" fill="url(#gold)" stroke="#30212a" stroke-width="2.2" stroke-linejoin="round"/>
    <path d="m17.5 43.7 11.7 2h5.6l11.7-2" fill="none" stroke="#ffe9a6" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>
    <circle cx="18" cy="44.3" r="1.4" fill="#f8d476"/>
    <circle cx="46" cy="44.3" r="1.4" fill="#f8d476"/>

    <path d="M28.8 47.5h6.4v12.8h-6.4Z" fill="url(#grip)" stroke="#281c21" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m29.4 49.5 5.2 2m-5.2 1 5.2 2m-5.2 1 5.2 2" fill="none" stroke="#e2a65e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="m27.8 60.3 4.2-2 4.2 2-1 4h-6.4l-1-4Z" fill="url(#gold)" stroke="#30212a" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
