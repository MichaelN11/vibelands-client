<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title">
  <title id="title">Planted heater shield marking a braced soldier</title>
  <defs>
    <linearGradient id="rim" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8fbcc4"/>
      <stop offset=".45" stop-color="#3d6d7e"/>
      <stop offset="1" stop-color="#16333f"/>
    </linearGradient>
    <linearGradient id="plate" x1="20" y1="10" x2="44" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eaf7f8"/>
      <stop offset=".38" stop-color="#a6ced5"/>
      <stop offset=".74" stop-color="#538897"/>
      <stop offset="1" stop-color="#274f5f"/>
    </linearGradient>
    <linearGradient id="sheen" x1="18" y1="10" x2="40" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="face">
      <path d="M17 13q15-4 30 0c0 19.5-3.8 31-15 40.5C20.8 44 17 32.5 17 13Z"/>
    </clipPath>
  </defs>

  <!-- The shield edge: one heavy silhouette that survives being 26 px tall. -->
  <path d="M12 9q20-4.5 40 0c0 24-4.5 37.5-20 50C16.5 46.5 12 33 12 9Z" fill="url(#rim)" stroke="#0b1a21" stroke-width="3.2" stroke-linejoin="round"/>

  <!-- Face, inset so the rim reads as a raised band rather than a drawn line. -->
  <path d="M17 13q15-4 30 0c0 19.5-3.8 31-15 40.5C20.8 44 17 32.5 17 13Z" fill="url(#plate)" stroke="#0b1a21" stroke-width="1.7" stroke-linejoin="round"/>
  <g clip-path="url(#face)">
    <path d="M17 11h30v10L21 47l-4-9Z" fill="url(#sheen)"/>
    <path d="M32 13v40" stroke="#0d2029" stroke-width="1.1" opacity=".28"/>
    <path d="M31 13v40" stroke="#dff2f4" stroke-width="1" opacity=".38"/>
  </g>
  <path d="M19.5 15q12.5-3 25 0" fill="none" stroke="#e8fafb" stroke-width="1.3" stroke-linecap="round" opacity=".7"/>

  <!-- Rivets around the band. Five, not a full ring: more becomes gravel. With
       no boss on the face these are the only warm marks on the icon, and they
       are what keeps a bare steel plate from reading as a blank at distance. -->
  <g fill="#e8c168" stroke="#3b2a12" stroke-width=".8">
    <circle cx="32" cy="8.9" r="1.5"/>
    <circle cx="14.6" cy="21" r="1.5"/>
    <circle cx="49.4" cy="21" r="1.5"/>
    <circle cx="16.2" cy="35" r="1.4"/>
    <circle cx="47.8" cy="35" r="1.4"/>
  </g>
</svg>
