<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">Venom</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="76%">
      <stop stop-color="#304522"/>
      <stop offset=".56" stop-color="#172016"/>
      <stop offset="1" stop-color="#08090b"/>
    </radialGradient>
    <radialGradient id="venom" cx="36%" cy="27%" r="72%">
      <stop stop-color="#edff9a"/>
      <stop offset=".3" stop-color="#a8e84d"/>
      <stop offset=".67" stop-color="#4c942d"/>
      <stop offset="1" stop-color="#244821"/>
    </radialGradient>
    <linearGradient id="fang" x1="18" y1="9" x2="47" y2="35" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8c9ae"/>
      <stop offset=".48" stop-color="#8b7c69"/>
      <stop offset="1" stop-color="#403a39"/>
    </linearGradient>
    <filter id="glow" x="-65%" y="-55%" width="230%" height="220%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="7" fill="url(#bg)"/>
  <path d="M7 16c13 3 20 11 25 24C37 27 44 19 57 16M4 31c12-1 21 3 28 9 7-6 16-10 28-9M13 53c5-9 11-13 19-13 8 0 14 4 19 13" fill="none" stroke="#668047" stroke-width="1.2" opacity=".3"/>

  <!-- Inward-curving spider fangs frame the source of the harmful venom. -->
  <path d="M11 8c2 15 8 24 19 28-6-7-8-14-7-23L11 8Zm42 0c-2 15-8 24-19 28 6-7 8-14 7-23L53 8Z" fill="url(#fang)" stroke="#28272a" stroke-width="2.2" stroke-linejoin="round"/>
  <path d="M15 12c2 9 6 15 12 19m22-19c-2 9-6 15-12 19" fill="none" stroke="#eee2c7" stroke-width="1.4" stroke-linecap="round" opacity=".68"/>

  <!-- A luminous, heavy droplet is the main read at aura size. -->
  <path d="M32 25c-4 9-14 18-14 26a14 14 0 0 0 28 0c0-8-10-17-14-26Z" fill="#75c83b" opacity=".42" filter="url(#glow)"/>
  <path d="M32 23c-4 10-15 19-15 28a15 15 0 0 0 30 0c0-9-11-18-15-28Z" fill="url(#venom)" stroke="#b9eb62" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M25 42c-3 6-2 13 3 17" fill="none" stroke="#efffb0" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
  <path d="M32 32v11l-6 6m6-6 7 5m-7 1 4 7" fill="none" stroke="#315d28" stroke-width="1.5" stroke-linecap="round" opacity=".9"/>
  <circle cx="37" cy="38" r="2" fill="#e4ff8a" opacity=".72"/>
  <circle cx="40" cy="53" r="1.3" fill="#d9ff76" opacity=".68"/>

  <rect x=".75" y=".75" width="62.5" height="62.5" rx="6.25" fill="none" stroke="#87b44f" stroke-opacity=".76" stroke-width="1.5"/>
</svg>
